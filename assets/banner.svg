<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Baton — continues where you left off">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title  { font: 800 84px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .tag    { font: 500 27px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #c7d2fe; }
      .chip   { font: 600 17px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #0b1020; }
      .node   { font: 700 18px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .caret  { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise   { animation: rise .8s ease-out both; }
      .d1 { animation-delay:.15s } .d2 { animation-delay:.4s } .d3 { animation-delay:.65s }
      @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="360" fill="url(#glow)">
    <animate attributeName="cx" values="180;1020;180" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- title -->
  <g class="rise d1" filter="url(#soft)">
    <text x="72" y="150" class="title">🏃 Baton</text>
  </g>

  <!-- typed tagline -->
  <g class="rise d2">
    <text x="78" y="200" class="tag">Continues where you left off.<tspan class="caret" dx="4">▋</tspan></text>
  </g>

  <!-- feature chips -->
  <g class="rise d3">
    <g transform="translate(78,238)">
      <rect width="150" height="34" rx="17" fill="url(#accent)"/>
      <text x="75" y="23" text-anchor="middle" class="chip">zero-dependency</text>
    </g>
    <g transform="translate(240,238)">
      <rect width="182" height="34" rx="17" fill="#e2e8f0"/>
      <text x="91" y="23" text-anchor="middle" class="chip">agent-neutral MCP</text>
    </g>
    <g transform="translate(434,238)">
      <rect width="196" height="34" rx="17" fill="#c4b5fd"/>
      <text x="98" y="23" text-anchor="middle" class="chip">Claude Code · Codex</text>
    </g>
  </g>

  <!-- relay animation, right side -->
  <g transform="translate(720,120)">
    <line x1="40" y1="60" x2="380" y2="60" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="60" x2="380" y2="60" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- node A -->
    <circle cx="40" cy="60" r="30" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
    <text x="40" y="66" text-anchor="middle" class="node">CC</text>
    <text x="40" y="120" text-anchor="middle" class="node" font-size="14" fill="#94a3b8">Claude</text>

    <!-- node B -->
    <circle cx="380" cy="60" r="30" fill="#1e293b" stroke="#22d3ee" stroke-width="3"/>
    <text x="380" y="66" text-anchor="middle" class="node">CX</text>
    <text x="380" y="120" text-anchor="middle" class="node" font-size="14" fill="#94a3b8">Codex</text>

    <!-- travelling baton -->
    <g>
      <rect x="-9" y="-4" width="18" height="8" rx="4" fill="#fde68a" stroke="#f59e0b" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <animateMotion path="M40,60 L380,60" dur="2.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/>
    </g>
  </g>
</svg>
